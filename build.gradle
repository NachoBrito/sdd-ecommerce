application {
    mainClass = "es.nachobrito.sdd.ecommerce.Application"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll([
        "-parameters",
        "-Xlint:all",
        "-Xlint:-processing",
        "-Xlint:-classfile",
        "-Werror"
    ])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events("passed", "skipped", "failed")
        showStandardStreams = false
    }
    finalizedBy(tasks.named("jacocoTestReport"))
}

checkstyle {
    toolVersion = "10.21.4"
    configFile = file("config/checkstyle/checkstyle.xml")
    maxWarnings = 0
    ignoreFailures = false
}

pmd {
    toolVersion = "7.28.0"
    consoleOutput = true
    ruleSetConfig = resources.text.fromFile("config/pmd/pmd.xml")
    ruleSets = []
    ignoreFailures = false
}

spotbugs {
    toolVersion = "4.10.5"
    effort.set(com.github.spotbugs.snom.Effort.valueOf("MAX"))
    reportLevel.set(com.github.spotbugs.snom.Confidence.valueOf("LOW"))
    ignoreFailures = false
    excludeFilter.set(file("config/spotbugs/exclude.xml"))
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.withType(io.micronaut.gradle.testresources.StartTestResourcesService).configureEach {
    useClassDataSharing.set(false)
}

// Conventional Commits git hook installation task
tasks.register("installGitHooks") {
    description = "Installs git commit-msg hook enforcing Conventional Commits"
    group = "verification"
    doLast {
        def hookFile = file(".git/hooks/commit-msg")
        if (file(".git").exists()) {
            hookFile.parentFile.mkdirs()
            hookFile.text = """#!/usr/bin/env bash
# Conventional Commits regex validation
commit_msg=\$(cat "\$1")
pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-zA-Z0-9_-]+\\))?: .+"
if ! echo "\$commit_msg" | grep -qE "\$pattern"; then
    echo "ERROR: Invalid commit message format."
    echo "Commit message MUST follow Conventional Commits:"
    echo "  <type>(<optional scope>): <subject>"
    echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
    echo "Example: feat(catalog): add product creation endpoint"
    exit 1
fi
"""
            hookFile.setExecutable(true)
            println("Conventional Commits hook installed at " + hookFile)
        }
    }
}

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("es.nachobrito.sdd.ecommerce.*")
    }
    aot {
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}

// Ensure check task executes all quality verification tools
tasks.named("check") {
    dependsOn(tasks.withType(Checkstyle))
    dependsOn(tasks.withType(Pmd))
    dependsOn(tasks.withType(com.github.spotbugs.snom.SpotBugsTask))
    dependsOn(tasks.named("jacocoTestCoverageVerification"))
}

jacoco {
    toolVersion = "0.8.13"
}

def jacocoExcludes = [
    "es/nachobrito/sdd/ecommerce/Application.*",
    "**/generated/**",
    "**/*\$*"
]

tasks.named("jacocoTestReport", JacocoReport) {
    dependsOn(tasks.named("test"))
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
        sourceSets.main.output.classesDirs.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }
    )
}

tasks.named("jacocoTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn(tasks.named("test"))
    classDirectories.setFrom(
        sourceSets.main.output.classesDirs.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }
    )
    violationRules {
        rule {
            element = "BUNDLE"
            limit {
                counter = "INSTRUCTION"
                value = "COVEREDRATIO"
                minimum = 0.80
            }
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = 0.80
            }
        }
    }
}
