micronaut:
  application:
    name: "SDD Ecommerce"
  server:
    port: ${MICRONAUT_SERVER_PORT:8080}
    cors:
      enabled: true
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

micrometer:
  observation:
    http:
      server:
        enabled: true
      client:
        enabled: true

datasources:
  default:
    db-type: mariadb
    dialect: MYSQL
    driver-class-name: org.mariadb.jdbc.Driver

liquibase:
  datasources:
    default:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-master.xml

rabbitmq:
  exchange:
    orders: ${RABBITMQ_ORDERS_EXCHANGE:ecommerce.orders.exchange}
  queue:
    notifications: ${RABBITMQ_ORDERS_NOTIFICATIONS_QUEUE:ecommerce.orders.notifications.queue}


endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
  prometheus:
    enabled: true
    sensitive: false

otel:
  traces:
    exporter: none

smtp:
  enabled: ${SMTP_ENABLED:true}
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:1025}
  from-address: ${SMTP_FROM_ADDRESS:no-reply@ecommerce.example.com}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  ssl: ${SMTP_SSL:false}
  starttls: ${SMTP_STARTTLS:false}
