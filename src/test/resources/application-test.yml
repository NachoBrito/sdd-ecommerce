micronaut:
  application:
    name: "SDD Ecommerce Test"
  server:
    port: -1
  test:
    resources:
      enabled: true
      client:
        read-timeout: 120s
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true

endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    rabbitmq:
      enabled: false
  prometheus:
    enabled: true
    sensitive: false

datasources:
  default:
    db-type: mariadb
    dialect: MYSQL
    driver-class-name: org.mariadb.jdbc.Driver

rabbitmq:
  enabled: true

liquibase:
  datasources:
    default:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-master.xml

smtp:
  enabled: true
  host: localhost
  port: 1025
  from-address: no-reply@ecommerce.example.com
